name: Native TLS helper correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-tls
      - name: Read pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luce-tls/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luce-tls/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(tr -d '\n' < luce-tls/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap without language source changes
        working-directory: luce-tls
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-tls
        run: python3 tests/run.py
      - name: Memory safety instrumentation
        working-directory: luce-tls
        run: python3 tests/sanitize.py
